name: pupu
description: Pupu - 心理+生理健康管理 App
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^3.3.2

  # Supabase (云端备份与认证)
  supabase_flutter: ^2.8.0

  # 音频（计时页，本地 + 淡入淡出）
  audioplayers: ^6.0.0
  record: ^7.1.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  permission_handler: ^12.0.0

  # 工具
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/audio/home_music/
    - assets/images/

  fonts:
    - family: Josefin Sans
      fonts:
        - asset: assets/fonts/JosefinSans-wght.ttf
          weight: 300
        - asset: assets/fonts/JosefinSans-wght.ttf
          weight: 400
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-wght.ttf
          weight: 100
        - asset: assets/fonts/Raleway-Italic-wght.ttf
          weight: 100
          style: italic
    - family: SF Pro
      fonts:
        - asset: assets/fonts/Inter-opsz-wght.ttf
          weight: 300
        - asset: assets/fonts/Inter-opsz-wght.ttf
          weight: 400
        - asset: assets/fonts/Inter-opsz-wght.ttf
          weight: 500
        - asset: assets/fonts/Inter-opsz-wght.ttf
          weight: 600
        - asset: assets/fonts/Inter-Italic-opsz-wght.ttf
          weight: 400
          style: italic
    - family: SF Pro Rounded
      fonts:
        - asset: assets/fonts/Nunito-wght.ttf
          weight: 500
        - asset: assets/fonts/Nunito-wght.ttf
          weight: 600




